version: 2
updates:
  # npm dependencies.
  #
  # Routine version bumps are kept low-noise: monthly, grouped, and capped.
  # Security fixes are NOT subject to this cadence — Dependabot opens those
  # immediately regardless of schedule (driven by GitHub security advisories).
  # Deeper checks (audit, CodeQL, Scorecard) live in their own workflows;
  # Dependabot here is just the version/security-PR opener, not the gate.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(dev-deps)
    groups:
      # One PR for all non-breaking dev-dependency bumps. Majors are excluded
      # so a breaking bump arrives as its own reviewable PR — never bundled
      # into an otherwise-green group (which is how the Angular 18/21 mismatch
      # slipped through before).
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Don't auto-propose major bumps; review and do those deliberately.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - '*'
