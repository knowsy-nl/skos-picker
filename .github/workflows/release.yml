name: Release

# Publishes @knowsy/skos-picker to npm.
#
# Two safeguards so nothing reaches npm without your approval:
#   1. The job runs in the `release` GitHub Environment. Configure that
#      environment (Settings → Environments → release) with yourself as a
#      REQUIRED REVIEWER — every run then pauses for your one-click approval,
#      even if a tag is pushed by someone else.
#   2. It can be started either by pushing a v* tag OR manually from the
#      Actions tab (workflow_dispatch).
#
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN secret to steal.
# One-time setup on npmjs.com: package Settings → Trusted Publisher → add this
# repo + this workflow file. Provenance is attached automatically.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege. id-token is required for OIDC trusted publishing; contents
# stays read-only — publishing does not need write access to the repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release # gates the run behind required-reviewer approval
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build Angular adapter
        run: pnpm run build:angular

      # Ensure a recent npm that supports OIDC trusted publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public
