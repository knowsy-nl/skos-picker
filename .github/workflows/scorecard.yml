name: OpenSSF Scorecard

# Scores the repo's supply-chain health (pinned deps, branch protection,
# token permissions, dangerous workflow patterns, etc.) and publishes the
# result to the Security tab. Enables the Scorecard badge once it has run.

on:
  branch_protection_rule:
  schedule:
    - cron: '32 5 * * 1' # weekly, Monday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      id-token: write # publish results for the public badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: results.sarif
