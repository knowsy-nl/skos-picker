name: OpenSSF Scorecard

# Scores the repo's supply-chain health (pinned deps, branch protection,
# token permissions, dangerous workflow patterns, etc.) and publishes the
# result to the Security tab. Enables the Scorecard badge once it has run.

on:
  branch_protection_rule:
  schedule:
    - cron: '32 5 * * 1' # weekly, Monday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results to the Security tab
      id-token: write # publish results for the public badge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@84498526a009a99c875e83ef4821a8ba52de7c22 # codeql-bundle-v2.25.5
        with:
          sarif_file: results.sarif
